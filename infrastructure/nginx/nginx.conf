# Account links contain one-time tokens in their query strings. Do not record
# those requests in access logs; ingress/load-balancer logs need the same rule.
map $uri $only1ai_loggable {
  default 1;
  ~^/(verify-email|reset-password)/?$ 0;
}

server {
  listen 80;
  server_name _;
  access_log /var/log/nginx/access.log combined if=$only1ai_loggable;

  # TLS is terminated here in production; configure certificates through the deployment platform.
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy no-referrer always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  # Next.js emits bootstrap scripts inline; migrate to nonce-based CSP before removing 'unsafe-inline'.
  add_header Content-Security-Policy "default-src 'self'; connect-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'" always;

  location /api/ {
    # No trailing slash: retain /api/v1 so Nest's URI versioning receives it.
    proxy_pass http://api:3001;
    proxy_set_header Host $host;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Sensitive user data and session responses must not be stored by browsers
    # or shared caches. Repeat security headers because location-level
    # add_header directives override inherited server-level headers.
    proxy_hide_header Cache-Control;
    proxy_hide_header Expires;
    add_header Cache-Control "private, no-store" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'" always;
  }

  location / {
    proxy_pass http://web:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
