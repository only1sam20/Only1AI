# Use together with docker-compose.yml. TLS is terminated by the hosting platform or load balancer.
services:
  postgres:
    ports: !reset []
    restart: unless-stopped
  redis:
    ports: !reset []
    restart: unless-stopped
  api:
    ports: !reset []
    restart: unless-stopped
    environment:
      NODE_ENV: production
      WEB_ORIGIN: ${WEB_ORIGIN:?Set WEB_ORIGIN to the public HTTPS origin}
  ai:
    ports: !reset []
    restart: unless-stopped
  web:
    ports: !reset []
    restart: unless-stopped
  nginx:
    restart: unless-stopped
